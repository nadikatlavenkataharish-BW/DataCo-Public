<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ageing Buckets (AR/AP) — preview</title>
<style>
  :root { --ink:#33414A; --muted:#8794A0; --line:#E3E8ED; --bg:#F7F9FB; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:'72',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:24px 20px 56px; }
  h1 { margin:0 0 2px; font-size:20px; }
  p.sub { margin:0 0 16px; color:var(--muted); font-size:13px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; background:#fff;
         border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:16px; }
  .bar label { font-size:13px; display:flex; align-items:center; gap:6px; }
  .bar input[type=number]{ width:70px; }
  select, input { font:inherit; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; overflow:auto; }
  #chart { width:100%; height:460px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Ageing Buckets (AR/AP) — preview</h1>
  <p class="sub">Same renderer the SAC widget uses, with synthetic data. Tweak the options and it re-renders.</p>
  <div class="bar"><label>Top N <input type="number" step="1" data-k="topN" value="10"/></label><label>Sort <select data-k="sortBy"><option value="overdue" selected>overdue</option><option value="total">total</option><option value="name">name</option></select></label><label>Not-overdue buckets <input type="number" step="1" data-k="currentBuckets" value="1"/></label><label><input type="checkbox" data-k="showTiles" checked/> Summary tiles</label><label><input type="checkbox" data-k="showPct" checked/> % overdue column</label><label>Currency <select data-k="currency"><option value="ZAR" selected>ZAR</option><option value="USD">USD</option><option value="custom">custom</option></select></label><label>Number scale <select data-k="valueScale"><option value="auto" selected>auto</option><option value="none">none</option><option value="K">K</option><option value="M">M</option><option value="B">B</option></select></label><label>Decimals <input type="number" step="1" data-k="decimals" value="1"/></label></div>
  <div class="card"><div id="chart"></div></div>
</div>
<script src="renderer.core.js"></script>
<script>

var C=["Shoprite Holdings","Pick n Pay","Massmart","Spar Group","Clicks","Woolworths","Dis-Chem","Builders","Makro","Game","Checkers Hyper","Boxer","OK Foods","Cambridge"];
function sample(){ var s=5; function r(){ s=(s*9301+49297)%233280; return s/233280; }
  return {buckets:["Current","1-30","31-60","61-90","90+"], rows:C.map(function(c,i){ var base=(14-i)*1.1e6*(0.6+r());
    return {label:c, values:[base*0.55, base*(0.15+r()*0.15), base*r()*0.12, base*r()*0.08, base*(i%4===1?0.2:r()*0.05)]}; })}; }
var opts = {};
function draw(){
  var el=document.getElementById("chart");
  var o=Object.assign({}, opts, {width: el.clientWidth, height: el.clientHeight});
  el.innerHTML = buildAgeingSVG(sample(o), o);
}
document.querySelectorAll("[data-k]").forEach(function(el){
  function read(){ var k=el.dataset.k; opts[k] = el.type==="checkbox" ? el.checked : (el.type==="number" ? Number(el.value) : el.value); }
  read(); el.addEventListener("change", function(){ read(); draw(); });
});
window.addEventListener("resize", draw); draw();
</script>
</body>
</html>
