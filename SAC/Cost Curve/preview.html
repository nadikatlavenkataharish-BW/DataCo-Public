<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cost Curve — preview</title>
<style>
  :root { --ink:#33414A; --muted:#8794A0; --line:#E3E8ED; --bg:#F7F9FB; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:'72',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:24px 20px 56px; }
  h1 { margin:0 0 2px; font-size:20px; }
  p.sub { margin:0 0 16px; color:var(--muted); font-size:13px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; background:#fff;
         border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:16px; }
  .bar label { font-size:13px; display:flex; align-items:center; gap:6px; }
  .bar input[type=number]{ width:70px; }
  select, input { font:inherit; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; overflow:auto; }
  #chart { width:100%; height:420px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Cost Curve — preview</h1>
  <p class="sub">Same renderer the SAC widget uses, with synthetic data. Tweak the options and it re-renders.</p>
  <div class="bar"><label>Price line (0 = off) <input type="number" step="any" data-k="price" value="4.1"/></label><label><input type="checkbox" data-k="showQuartiles" checked/> Quartiles</label><label>Bar labels <select data-k="showLabels"><option value="highlight" selected>highlight</option><option value="all">all</option><option value="none">none</option></select></label><label>Cost decimals <input type="number" step="1" data-k="costDecimals" value="2"/></label><label>Number scale <select data-k="valueScale"><option value="auto" selected>auto</option><option value="none">none</option><option value="K">K</option><option value="M">M</option><option value="B">B</option></select></label><label>Decimals <input type="number" step="1" data-k="decimals" value="0"/></label></div>
  <div class="card"><div id="chart"></div></div>
</div>
<script src="renderer.core.js"></script>
<script>

var OPS=[["Mine A",420,1.15,"Peer"],["Mine B",310,1.42,"Peer"],["Our Mine 1",260,1.55,"Us"],["Mine C",510,1.62,"Peer"],["Mine D",180,1.78,"Peer"],
["Mine E",390,1.90,"Peer"],["Our Mine 2",150,2.05,"Us"],["Mine F",220,2.21,"Peer"],["Mine G",300,2.38,"Peer"],["Mine H",140,2.60,"Peer"],
["Mine I",260,2.86,"Peer"],["Mine J",120,3.10,"Peer"],["Mine K",90,3.55,"Peer"]];
function sample(){ return {items:OPS.map(function(r){return {label:r[0],production:r[1],cost:r[2],group:r[3]};}), labels:{production:"production",cost:"C1 cost"}}; }
var opts = {"highlightGroup": "Us", "price": 4.1, "priceLabel": "Spot Cu"};
function draw(){
  var el=document.getElementById("chart");
  var o=Object.assign({}, opts, {width: el.clientWidth, height: el.clientHeight});
  el.innerHTML = buildCostCurveSVG(sample(o), o);
}
document.querySelectorAll("[data-k]").forEach(function(el){
  function read(){ var k=el.dataset.k; opts[k] = el.type==="checkbox" ? el.checked : (el.type==="number" ? Number(el.value) : el.value); }
  read(); el.addEventListener("change", function(){ read(); draw(); });
});
window.addEventListener("resize", draw); draw();
</script>
</body>
</html>
