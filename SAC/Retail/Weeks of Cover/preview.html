<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Weeks of Cover — preview</title>
<style>
  :root { --ink:#33414A; --muted:#8794A0; --line:#E3E8ED; --bg:#F7F9FB; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:'72',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:24px 20px 56px; }
  h1 { margin:0 0 2px; font-size:20px; }
  p.sub { margin:0 0 16px; color:var(--muted); font-size:13px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; background:#fff;
         border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:16px; }
  .bar label { font-size:13px; display:flex; align-items:center; gap:6px; }
  .bar input[type=number]{ width:70px; }
  select, input { font:inherit; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; overflow:auto; }
  #chart { width:100%; height:440px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Weeks of Cover — preview</h1>
  <p class="sub">Same renderer the SAC widget uses, with synthetic data. Tweak the options and it re-renders.</p>
  <div class="bar"><label>Target min weeks <input type="number" step="any" data-k="minWeeks" value="4"/></label><label>Target max weeks <input type="number" step="any" data-k="maxWeeks" value="8"/></label><label>Axis cap (weeks) <input type="number" step="1" data-k="capWeeks" value="20"/></label><label>Sort <select data-k="sortBy"><option value="risk" selected>risk</option><option value="cover">cover</option><option value="name">name</option><option value="value">value</option></select></label><label>OOS flag above (%) <input type="number" step="any" data-k="oosTarget" value="3"/></label><label>Aged flag above (%) <input type="number" step="any" data-k="agedTarget" value="10"/></label><label>Currency <select data-k="currency"><option value="ZAR" selected>ZAR</option><option value="USD">USD</option><option value="custom">custom</option></select></label><label>Number scale <select data-k="valueScale"><option value="auto" selected>auto</option><option value="none">none</option><option value="K">K</option><option value="M">M</option><option value="B">B</option></select></label><label>Decimals <input type="number" step="1" data-k="decimals" value="1"/></label></div>
  <div class="card"><div id="chart"></div></div>
</div>
<script src="renderer.core.js"></script>
<script>

var R=[["Fresh produce",4200,1400,0.21e6,6.2,1.0],["Dairy",9800,2300,0.48e6,2.1,0.5],["Bakery",1800,950,0.05e6,4.8,0.2],["Frozen",22500,2100,1.64e6,1.2,14.0],
["Beverages",61000,7200,3.9e6,0.9,6.5],["Snacks",34000,3100,1.42e6,1.8,9.1],["Household",51000,3900,2.7e6,1.1,18.2],["Personal care",28500,2600,2.05e6,2.4,12.0],
["Baby",7400,920,0.81e6,3.9,4.0],["Pet",15800,1100,0.95e6,0.8,21.5],["Liquor",9400,1650,2.4e6,1.5,3.2],["General merchandise",12600,640,1.9e6,0.6,27.0]];
function sample(){ return {rows:R.map(function(x){return {label:x[0],stock:x[1],weeklySales:x[2],stockValue:x[3],oos:x[4],aged:x[5]};})}; }
var opts = {};
function draw(){
  var el=document.getElementById("chart");
  var o=Object.assign({}, opts, {width: el.clientWidth, height: el.clientHeight});
  el.innerHTML = buildWeeksCoverSVG(sample(o), o);
}
document.querySelectorAll("[data-k]").forEach(function(el){
  function read(){ var k=el.dataset.k; opts[k] = el.type==="checkbox" ? el.checked : (el.type==="number" ? Number(el.value) : el.value); }
  read(); el.addEventListener("change", function(){ read(); draw(); });
});
window.addEventListener("resize", draw); draw();
</script>
</body>
</html>
