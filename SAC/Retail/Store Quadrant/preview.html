<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Store Performance Quadrant — preview</title>
<style>
  :root { --ink:#33414A; --muted:#8794A0; --line:#E3E8ED; --bg:#F7F9FB; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:'72',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:24px 20px 56px; }
  h1 { margin:0 0 2px; font-size:20px; }
  p.sub { margin:0 0 16px; color:var(--muted); font-size:13px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; background:#fff;
         border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:16px; }
  .bar label { font-size:13px; display:flex; align-items:center; gap:6px; }
  .bar input[type=number]{ width:70px; }
  select, input { font:inherit; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; overflow:auto; }
  #chart { width:100%; height:480px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Store Performance Quadrant — preview</h1>
  <p class="sub">Same renderer the SAC widget uses, with synthetic data. Tweak the options and it re-renders.</p>
  <div class="bar"><label>Split by <select data-k="splitMode"><option value="median" selected>median</option><option value="target">target</option></select></label><label>X target <input type="number" step="any" data-k="xTarget" value="0"/></label><label>Y target <input type="number" step="any" data-k="yTarget" value="0"/></label><label>X format <select data-k="xFormat"><option value="currency" selected>currency</option><option value="pct">pct</option><option value="number">number</option></select></label><label>Y format <select data-k="yFormat"><option value="pct" selected>pct</option><option value="currency">currency</option><option value="number">number</option></select></label><label>Store labels <select data-k="labelMode"><option value="outliers" selected>outliers</option><option value="all">all</option><option value="none">none</option></select></label><label>Currency <select data-k="currency"><option value="ZAR" selected>ZAR</option><option value="USD">USD</option><option value="custom">custom</option></select></label><label>Number scale <select data-k="valueScale"><option value="auto" selected>auto</option><option value="none">none</option><option value="K">K</option><option value="M">M</option><option value="B">B</option></select></label><label>Decimals <input type="number" step="1" data-k="decimals" value="1"/></label></div>
  <div class="card"><div id="chart"></div></div>
</div>
<script src="renderer.core.js"></script>
<script>

function sample(){ var s=9; function r(){ s=(s*9301+49297)%233280; return s/233280; }
  var names=["Sandton City","Canal Walk","Gateway","Menlyn","Eastgate","Mall of Africa","V&A Waterfront","Cavendish","Tyger Valley","Rosebank","Clearwater","Somerset Mall","Bayside","Woodlands","Mimosa","Boardwalk","Liberty Midlands","Hemingways","Mall of the North","Galleria"];
  return {points:names.map(function(n){ var x=28000+r()*42000, y=0.24+r()*0.16+(x>52000?0.02:0); return {label:n,x:x,y:y,size:(20+r()*80)*1e6}; }), labels:{x:"Sales per m² (annual)",y:"Gross margin %",size:"Revenue"}}; }
var opts = {};
function draw(){
  var el=document.getElementById("chart");
  var o=Object.assign({}, opts, {width: el.clientWidth, height: el.clientHeight});
  el.innerHTML = buildQuadrantSVG(sample(o), o);
}
document.querySelectorAll("[data-k]").forEach(function(el){
  function read(){ var k=el.dataset.k; opts[k] = el.type==="checkbox" ? el.checked : (el.type==="number" ? Number(el.value) : el.value); }
  read(); el.addEventListener("change", function(){ read(); draw(); });
});
window.addEventListener("resize", draw); draw();
</script>
</body>
</html>
