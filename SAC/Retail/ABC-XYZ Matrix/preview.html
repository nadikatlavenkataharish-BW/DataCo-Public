<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ABC/XYZ Matrix — preview</title>
<style>
  :root { --ink:#33414A; --muted:#8794A0; --line:#E3E8ED; --bg:#F7F9FB; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:'72',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:24px 20px 56px; }
  h1 { margin:0 0 2px; font-size:20px; }
  p.sub { margin:0 0 16px; color:var(--muted); font-size:13px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; background:#fff;
         border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:16px; }
  .bar label { font-size:13px; display:flex; align-items:center; gap:6px; }
  .bar input[type=number]{ width:70px; }
  select, input { font:inherit; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; overflow:auto; }
  #chart { width:100%; height:480px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ABC/XYZ Matrix — preview</h1>
  <p class="sub">Same renderer the SAC widget uses, with synthetic data. Tweak the options and it re-renders.</p>
  <div class="bar"><label>A up to cumulative % <input type="number" step="any" data-k="aCut" value="80"/></label><label>B up to cumulative % <input type="number" step="any" data-k="bCut" value="95"/></label><label>X max CV <input type="number" step="any" data-k="xCut" value="0.5"/></label><label>Y max CV <input type="number" step="any" data-k="yCut" value="1"/></label><label><input type="checkbox" data-k="showActions" checked/> Policy hints</label><label><input type="checkbox" data-k="showTopSkus" checked/> AZ watch-list</label><label>Currency <select data-k="currency"><option value="ZAR" selected>ZAR</option><option value="USD">USD</option><option value="custom">custom</option></select></label><label>Number scale <select data-k="valueScale"><option value="auto" selected>auto</option><option value="none">none</option><option value="K">K</option><option value="M">M</option><option value="B">B</option></select></label><label>Decimals <input type="number" step="1" data-k="decimals" value="1"/></label></div>
  <div class="card"><div id="chart"></div></div>
</div>
<script src="renderer.core.js"></script>
<script>

function sample(){ var s=3; function r(){ s=(s*9301+49297)%233280; return s/233280; } var skus=[];
  for(var i=0;i<180;i++){ var base=Math.pow(0.965,i)*2.4e6, vol=r()<0.35?0.15+r()*0.3:(r()<0.6?0.55+r()*0.4:1.1+r()*0.8);
    skus.push({label:"SKU "+(1000+i), revenue:base*(0.8+r()*0.4), cv:vol}); }
  return {skus:skus}; }
var opts = {};
function draw(){
  var el=document.getElementById("chart");
  var o=Object.assign({}, opts, {width: el.clientWidth, height: el.clientHeight});
  el.innerHTML = buildAbcXyzSVG(sample(o), o);
}
document.querySelectorAll("[data-k]").forEach(function(el){
  function read(){ var k=el.dataset.k; opts[k] = el.type==="checkbox" ? el.checked : (el.type==="number" ? Number(el.value) : el.value); }
  read(); el.addEventListener("change", function(){ read(); draw(); });
});
window.addEventListener("resize", draw); draw();
</script>
</body>
</html>
