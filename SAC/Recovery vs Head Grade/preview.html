<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recovery vs Head Grade — preview</title>
<style>
  :root { --ink:#33414A; --muted:#8794A0; --line:#E3E8ED; --bg:#F7F9FB; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:'72',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:24px 20px 56px; }
  h1 { margin:0 0 2px; font-size:20px; }
  p.sub { margin:0 0 16px; color:var(--muted); font-size:13px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; background:#fff;
         border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:16px; }
  .bar label { font-size:13px; display:flex; align-items:center; gap:6px; }
  .bar input[type=number]{ width:70px; }
  select, input { font:inherit; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; overflow:auto; }
  #chart { width:100%; height:440px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Recovery vs Head Grade — preview</h1>
  <p class="sub">Same renderer the SAC widget uses, with synthetic data. Tweak the options and it re-renders.</p>
  <div class="bar"><label>Fit <select data-k="fitType"><option value="log" selected>log</option><option value="linear">linear</option><option value="none">none</option></select></label><label>Target recovery (%) <input type="number" step="any" data-k="targetRecovery" value="88"/></label><label>Band ± (%) <input type="number" step="any" data-k="targetBand" value="2"/></label><label>Recovery input <select data-k="recoveryScale"><option value="auto" selected>auto</option><option value="percent">percent</option><option value="fraction">fraction</option></select></label><label>Colour points by <select data-k="colorBy"><option value="band" selected>band</option><option value="group">group</option></select></label><label><input type="checkbox" data-k="showStats" checked/> Stats panel</label><label>Point size <input type="number" step="1" data-k="pointSize" value="4"/></label><label>Grade decimals <input type="number" step="1" data-k="gradeDecimals" value="2"/></label></div>
  <div class="card"><div id="chart"></div></div>
</div>
<script src="renderer.core.js"></script>
<script>

function sample(){ var pts=[], s=7; function r(){ s=(s*9301+49297)%233280; return s/233280; }
  for(var d=1; d<=90; d++){ var g=0.45+r()*0.6, rec=86.8+6.5*Math.log(g/0.7)+ (r()-0.5)*4.5; pts.push({label:"Day "+d, grade:g, recovery:rec, group:d<=30?"Jan":d<=60?"Feb":"Mar"}); }
  return {points:pts, labels:{grade:"Head grade",recovery:"Cu recovery"}}; }
var opts = {"colorBy": "band"};
function draw(){
  var el=document.getElementById("chart");
  var o=Object.assign({}, opts, {width: el.clientWidth, height: el.clientHeight});
  el.innerHTML = buildRecoverySVG(sample(o), o);
}
document.querySelectorAll("[data-k]").forEach(function(el){
  function read(){ var k=el.dataset.k; opts[k] = el.type==="checkbox" ? el.checked : (el.type==="number" ? Number(el.value) : el.value); }
  read(); el.addEventListener("change", function(){ read(); draw(); });
});
window.addEventListener("resize", draw); draw();
</script>
</body>
</html>
