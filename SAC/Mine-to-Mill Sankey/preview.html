<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mine-to-Mill Sankey — preview</title>
<style>
  :root { --ink:#33414A; --muted:#8794A0; --line:#E3E8ED; --bg:#F7F9FB; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:'72',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:24px 20px 56px; }
  h1 { margin:0 0 2px; font-size:20px; }
  p.sub { margin:0 0 16px; color:var(--muted); font-size:13px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; background:#fff;
         border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:16px; }
  .bar label { font-size:13px; display:flex; align-items:center; gap:6px; }
  .bar input[type=number]{ width:70px; }
  select, input { font:inherit; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; overflow:auto; }
  #chart { width:100%; height:440px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Mine-to-Mill Sankey — preview</h1>
  <p class="sub">Same renderer the SAC widget uses, with synthetic data. Tweak the options and it re-renders.</p>
  <div class="bar"><label>Colour links by <select data-k="colorBy"><option value="source" selected>source</option><option value="grade">grade</option></select></label><label>Node width (px) <input type="number" step="1" data-k="nodeWidth" value="14"/></label><label>Node gap (px) <input type="number" step="1" data-k="nodePadding" value="18"/></label><label><input type="checkbox" data-k="showValues" checked/> Node values</label><label><input type="checkbox" data-k="showLosses" checked/> Loss stubs</label><label>Grade decimals <input type="number" step="1" data-k="gradeDecimals" value="2"/></label><label>Number scale <select data-k="valueScale"><option value="auto" selected>auto</option><option value="none">none</option><option value="K">K</option><option value="M">M</option><option value="B">B</option></select></label><label>Decimals <input type="number" step="1" data-k="decimals" value="1"/></label></div>
  <div class="card"><div id="chart"></div></div>
</div>
<script src="renderer.core.js"></script>
<script>

var L=[["Open Pit North","ROM Stockpile",620000,0.62],["Open Pit North","Waste Dump",1450000,0.04],["Open Pit South","ROM Stockpile",410000,0.71],
["Open Pit South","Low-grade Stockpile",180000,0.31],["Underground","ROM Stockpile",240000,1.35],["Open Pit South","Waste Dump",900000,0.03],
["ROM Stockpile","Primary Crusher",1240000,0.79],["Low-grade Stockpile","Primary Crusher",60000,0.31],["Primary Crusher","Mill",1290000,0.77],
["Mill","Flotation",1275000,0.77],["Flotation","Concentrate",36000,24.1],["Flotation","Tailings",1230000,0.09]];
function sample(){ return {links:L.map(function(r){return {source:r[0],target:r[1],value:r[2],grade:r[3]};}), labels:{value:"Tonnes",grade:"Cu grade"}}; }
var opts = {};
function draw(){
  var el=document.getElementById("chart");
  var o=Object.assign({}, opts, {width: el.clientWidth, height: el.clientHeight});
  el.innerHTML = buildSankeySVG(sample(o), o);
}
document.querySelectorAll("[data-k]").forEach(function(el){
  function read(){ var k=el.dataset.k; opts[k] = el.type==="checkbox" ? el.checked : (el.type==="number" ? Number(el.value) : el.value); }
  read(); el.addEventListener("change", function(){ read(); draw(); });
});
window.addEventListener("resize", draw); draw();
</script>
</body>
</html>
