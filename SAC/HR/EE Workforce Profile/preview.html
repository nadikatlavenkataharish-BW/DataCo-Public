<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EE Workforce Profile (EEA2) — preview</title>
<style>
  :root { --ink:#33414A; --muted:#8794A0; --line:#E3E8ED; --bg:#F7F9FB; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:'72',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:24px 20px 56px; }
  h1 { margin:0 0 2px; font-size:20px; }
  p.sub { margin:0 0 16px; color:var(--muted); font-size:13px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; background:#fff;
         border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:16px; }
  .bar label { font-size:13px; display:flex; align-items:center; gap:6px; }
  .bar input[type=number]{ width:70px; }
  select, input { font:inherit; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; overflow:auto; }
  #chart { width:100%; height:360px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>EE Workforce Profile (EEA2) — preview</h1>
  <p class="sub">Same renderer the SAC widget uses, with synthetic data. Tweak the options and it re-renders.</p>
  <div class="bar"><label>Disability target % <input type="number" step="any" data-k="disabilityTarget" value="3"/></label><label><input type="checkbox" data-k="showPercentRow" checked/> % of total row</label><label><input type="checkbox" data-k="showRatios" checked/> Designated % columns</label><label><input type="checkbox" data-k="shadeCells" checked/> Shade cells</label></div>
  <div class="card"><div id="chart"></div></div>
</div>
<script src="renderer.core.js"></script>
<script>

var LV=["Top management","Senior management","Professionally qualified and experienced specialists and mid-management","Skilled technical and academically qualified workers, junior management, supervisors","Semi-skilled and discretionary decision making","Unskilled and defined decision making"];
var D=[[3,0,1,4, 1,0,0,2, 1,0],[9,2,4,12, 6,2,3,8, 2,1],[64,14,22,51, 58,16,19,40, 6,3],[240,38,31,62, 268,52,27,48, 9,4],[410,61,12,18, 380,74,9,11, 7,2],[290,44,3,2, 205,31,1,1, 4,1]];
var R=["African","Coloured","Indian","White"];
function sample(){ var rows=[]; LV.forEach(function(l,i){ var d=D[i];
  for(var k=0;k<4;k++){ rows.push({level:l,race:R[k],gender:"Male",count:d[k],disabled:Math.round(d[k]*0.012)}); rows.push({level:l,race:R[k],gender:"Female",count:d[4+k],disabled:Math.round(d[4+k]*0.01)}); }
  rows.push({level:l,race:"Foreign national",gender:"Male",count:d[8],disabled:0}); rows.push({level:l,race:"Foreign national",gender:"Female",count:d[9],disabled:0}); });
  return {rows:rows}; }
var opts = {"targets": "Top management:20/25,Senior management:25/30,Professionally qualified:40/45,Skilled technical:50/48"};
function draw(){
  var el=document.getElementById("chart");
  var o=Object.assign({}, opts, {width: el.clientWidth, height: el.clientHeight});
  el.innerHTML = buildEepSVG(sample(o), o);
}
document.querySelectorAll("[data-k]").forEach(function(el){
  function read(){ var k=el.dataset.k; opts[k] = el.type==="checkbox" ? el.checked : (el.type==="number" ? Number(el.value) : el.value); }
  read(); el.addEventListener("change", function(){ read(); draw(); });
});
window.addEventListener("resize", draw); draw();
</script>
</body>
</html>
