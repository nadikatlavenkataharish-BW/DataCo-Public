<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Variance Heatmap — preview</title>
<style>
  :root { --ink:#33414A; --muted:#8794A0; --line:#E3E8ED; --bg:#F7F9FB; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:'72',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:24px 20px 56px; }
  h1 { margin:0 0 2px; font-size:20px; }
  p.sub { margin:0 0 16px; color:var(--muted); font-size:13px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; background:#fff;
         border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:16px; }
  .bar label { font-size:13px; display:flex; align-items:center; gap:6px; }
  .bar input[type=number]{ width:70px; }
  select, input { font:inherit; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; overflow:auto; }
  #chart { width:100%; height:400px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Variance Heatmap — preview</h1>
  <p class="sub">Same renderer the SAC widget uses, with synthetic data. Tweak the options and it re-renders.</p>
  <div class="bar"><label>Cell value <select data-k="mode"><option value="variancePct" selected>variancePct</option><option value="varianceAbs">varianceAbs</option><option value="value">value</option></select></label><label>Colouring <select data-k="colorMode"><option value="continuous" selected>continuous</option><option value="rag">rag</option></select></label><label>Unfavourable at (%) <input type="number" step="any" data-k="thresholdBad" value="-5"/></label><label>Favourable at (%) <input type="number" step="any" data-k="thresholdGood" value="5"/></label><label><input type="checkbox" data-k="invertSign"/> Cost measure (lower = good)</label><label><input type="checkbox" data-k="showValues" checked/> Cell labels</label><label><input type="checkbox" data-k="showTotals" checked/> Totals</label><label>Cell height (px) <input type="number" step="1" data-k="cellHeight" value="30"/></label><label>Row label width (px) <input type="number" step="1" data-k="labelWidth" value="130"/></label><label>Number scale <select data-k="valueScale"><option value="auto" selected>auto</option><option value="none">none</option><option value="K">K</option><option value="M">M</option><option value="B">B</option></select></label><label>Decimals <input type="number" step="1" data-k="decimals" value="1"/></label></div>
  <div class="card"><div id="chart"></div></div>
</div>
<script src="renderer.core.js"></script>
<script>

var SITES=["Site A","Site B","Site C","Site D","Site E","Site F"], MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function sample(){ var cells=[]; SITES.forEach(function(s,i){ MON.forEach(function(m,j){ if(j>9) return; var p=1000+i*150;
  cells.push({row:s,col:m,plan:p,actual:p*(1+0.09*Math.sin(i*2.1+j*0.7)-0.02*(i===2?2:0))}); }); });
  return {cells:cells, labels:{actual:"Actual",plan:"Plan"}}; }
var opts = {};
function draw(){
  var el=document.getElementById("chart");
  var o=Object.assign({}, opts, {width: el.clientWidth, height: el.clientHeight});
  el.innerHTML = buildVarHeatSVG(sample(o), o);
}
document.querySelectorAll("[data-k]").forEach(function(el){
  function read(){ var k=el.dataset.k; opts[k] = el.type==="checkbox" ? el.checked : (el.type==="number" ? Number(el.value) : el.value); }
  read(); el.addEventListener("change", function(){ read(); draw(); });
});
window.addEventListener("resize", draw); draw();
</script>
</body>
</html>
