<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Variance Bridge — preview</title>
<style>
  :root { --ink:#33414A; --muted:#8794A0; --line:#E3E8ED; --bg:#F7F9FB; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:'72',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:24px 20px 56px; }
  h1 { margin:0 0 2px; font-size:20px; }
  p.sub { margin:0 0 16px; color:var(--muted); font-size:13px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; background:#fff;
         border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:16px; }
  .bar label { font-size:13px; display:flex; align-items:center; gap:6px; }
  .bar input[type=number]{ width:70px; }
  select, input { font:inherit; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; overflow:auto; }
  #chart { width:100%; height:420px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Variance Bridge — preview</h1>
  <p class="sub">Same renderer the SAC widget uses, with synthetic data. Tweak the options and it re-renders.</p>
  <div class="bar"><label>Top N drivers <input type="number" step="1" data-k="topN" value="8"/></label><label>Sort <select data-k="sortBy"><option value="abs" selected>abs</option><option value="none">none</option></select></label><label><input type="checkbox" data-k="invertSign" checked/> Cost measure (lower = good)</label><label><input type="checkbox" data-k="showValues" checked/> Value labels</label><label><input type="checkbox" data-k="showConnectors" checked/> Connectors</label><label>Number scale <select data-k="valueScale"><option value="auto" selected>auto</option><option value="none">none</option><option value="K">K</option><option value="M">M</option><option value="B">B</option></select></label><label>Decimals <input type="number" step="1" data-k="decimals" value="1"/></label></div>
  <div class="card"><div id="chart"></div></div>
</div>
<script src="renderer.core.js"></script>
<script>

var DRIVERS=[["Labour",4.1e6,4.35e6],["Energy",3.2e6,3.71e6],["Maintenance",2.6e6,2.38e6],["Contractors",1.9e6,2.21e6],
  ["Consumables",1.5e6,1.42e6],["Freight",1.2e6,1.33e6],["Royalties",0.9e6,0.88e6],["Insurance",0.4e6,0.41e6],["IT",0.35e6,0.31e6],["Other Opex",0.6e6,0.66e6]];
function sample(){ return {items:DRIVERS.map(function(d){return {label:d[0],plan:d[1],actual:d[2]};}), labels:{plan:"Plan Opex",actual:"Actual Opex"}}; }
var opts = {};
function draw(){
  var el=document.getElementById("chart");
  var o=Object.assign({}, opts, {width: el.clientWidth, height: el.clientHeight});
  el.innerHTML = buildBridgeSVG(sample(o), o);
}
document.querySelectorAll("[data-k]").forEach(function(el){
  function read(){ var k=el.dataset.k; opts[k] = el.type==="checkbox" ? el.checked : (el.type==="number" ? Number(el.value) : el.value); }
  read(); el.addEventListener("change", function(){ read(); draw(); });
});
window.addEventListener("resize", draw); draw();
</script>
</body>
</html>
