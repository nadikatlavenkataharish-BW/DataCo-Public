<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fleet Status Timeline — preview</title>
<style>
  :root { --ink:#33414A; --muted:#8794A0; --line:#E3E8ED; --bg:#F7F9FB; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:'72',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:24px 20px 56px; }
  h1 { margin:0 0 2px; font-size:20px; }
  p.sub { margin:0 0 16px; color:var(--muted); font-size:13px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; background:#fff;
         border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:16px; }
  .bar label { font-size:13px; display:flex; align-items:center; gap:6px; }
  .bar input[type=number]{ width:70px; }
  select, input { font:inherit; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:14px; overflow:auto; }
  #chart { width:100%; height:440px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Fleet Status Timeline — preview</h1>
  <p class="sub">Same renderer the SAC widget uses, with synthetic data. Tweak the options and it re-renders.</p>
  <div class="bar"><label>Sort <select data-k="sortBy"><option value="name" selected>name</option><option value="utilisation">utilisation</option><option value="group">group</option></select></label><label>Row height (px) <input type="number" step="1" data-k="rowHeight" value="22"/></label><label>Label width (px) <input type="number" step="1" data-k="labelWidth" value="120"/></label><label><input type="checkbox" data-k="showSummary" checked/> % operating column</label><label><input type="checkbox" data-k="showLegend" checked/> Legend</label></div>
  <div class="card"><div id="chart"></div></div>
</div>
<script src="renderer.core.js"></script>
<script>

function sample(){ var ev=[], s=11; function r(){ s=(s*9301+49297)%233280; return s/233280; }
  var units=["HT-101","HT-102","HT-103","HT-104","HT-105","HT-106","EX-01","EX-02","DR-07","DR-08"], st=["Operating","Operating","Operating","Standby","Delay","Down","Maintenance"];
  var t0=Date.UTC(2026,10,11,6,0);
  units.forEach(function(u){ var t=t0; while(t<t0+12*36e5){ var k=st[Math.floor(r()*st.length)], d=(20+r()*100)*6e4; if(k==="Operating") d*=2.2;
      var e=Math.min(t+d,t0+12*36e5); ev.push({equip:u,status:k,start:new Date(t),end:new Date(e),group:u.slice(0,2)}); t=e; } });
  return {events:ev}; }
var opts = {};
function draw(){
  var el=document.getElementById("chart");
  var o=Object.assign({}, opts, {width: el.clientWidth, height: el.clientHeight});
  el.innerHTML = buildFleetSVG(sample(o), o);
}
document.querySelectorAll("[data-k]").forEach(function(el){
  function read(){ var k=el.dataset.k; opts[k] = el.type==="checkbox" ? el.checked : (el.type==="number" ? Number(el.value) : el.value); }
  read(); el.addEventListener("change", function(){ read(); draw(); });
});
window.addEventListener("resize", draw); draw();
</script>
</body>
</html>
